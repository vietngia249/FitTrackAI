name: FitTrack AI CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-ci:
    name: Backend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      - name: Lint Backend
        run: |
          cd backend
          npm run lint

      - name: Typecheck Backend
        run: |
          cd backend
          npm run typecheck

      - name: Build Backend
        run: |
          cd backend
          npm run build

      - name: Test Backend
        run: |
          cd backend
          npm test

  frontend-ci:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint

      - name: Typecheck Frontend
        run: |
          cd frontend
          npm run typecheck

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  worker-ci:
    name: Background Worker Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        run: |
          cd worker
          npm ci

      - name: Typecheck Worker
        run: |
          cd worker
          npm run typecheck

      - name: Build Worker
        run: |
          cd worker
          npm run build

